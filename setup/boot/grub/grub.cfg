# Set GRUB Colors
set menu_color_normal="cyan/black"
set menu_color_highlight="black/cyan"
set color_normal="cyan/black"

# Load Modules
insmod efi_gop
insmod efi_uga
insmod font

# Load Font
if loadfont /boot/grub/fonts/unicode.pf2
then
  insmod gfxterm
  set gfxmode=auto
  set gfxpayload=keep
  terminal_output gfxterm
fi

# Set Default and Timeout
set default=0
set timeout=-1

# qb Linux Kernel Menu
submenu "qb Linux Kernel" {
    menuentry "qb-rocket" {
        linux /boot/qb-kernel root=/dev/sda1 ro single
        initrd /boot/initramfs.cpio.gz
    }
    menuentry 'qb Linux Kernel' --class os {
        insmod gzio
        insmod part_gpt   # Use part_gpt for GPT partitions
        insmod fat        # Use fat for FAT32 file system, adjust if needed
        linux /boot/qb-kernel root=/dev/sda1 ro quiet splash video=1024x768@60
        initrd /boot/initramfs.cpio.gz
        set root=(hd0,gpt2)  # Adjust to your EFI System Partition (ESP) partition
    }
}
